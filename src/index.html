Phaser

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Retro Location Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: monospace;
    }
    #game-container {
      border: 4px solid #333;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

<div id="game-container"></div>

<script>
const config = {
  type: Phaser.AUTO,
  width: 480,
  height: 320,
  parent: 'game-container',
  pixelArt: true,
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 0 } }
  },
  scene: { preload, create, update }
};

const game = new Phaser.Game(config);
let player, cursors;

function preload() {
  this.load.image('player', 'https://labs.phaser.io/assets/sprites/phaser-dude.png');
}

function create() {
  // Draw a simple retro grid floor
  const graphics = this.add.graphics();
  graphics.fillStyle(0x2d3748, 1);
  graphics.fillRect(0, 0, 480, 320);
  
  graphics.lineStyle(1, 0x4a5568, 0.4);
  for (let x = 0; x < 480; x += 32) graphics.lineBetween(x, 0, x, 320);
  for (let y = 0; y < 320; y += 32) graphics.lineBetween(0, y, 480, y);

  // HUD Title
  this.add.text(16, 16, '📍 Airport Lounge', {
    font: '14px monospace',
    fill: '#48bb78',
    backgroundColor: '#1a202c',
    padding: { x: 8, y: 4 }
  });

  // Spawn avatar
  player = this.physics.add.sprite(240, 160, 'player');
  player.setCollideWorldBounds(true);

  cursors = this.input.keyboard.createCursorKeys();
}

function update() {
  player.setVelocity(0);

  if (cursors.left.isDown) player.setVelocityX(-120);
  if (cursors.right.isDown) player.setVelocityX(120);
  if (cursors.up.isDown) player.setVelocityY(-120);
  if (cursors.down.isDown) player.setVelocityY(120);
}
</script>


<!-- Retro Auth Modal Overlay -->
<div id="retro-auth-overlay" style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.75);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 99999;
">
  <!-- Retro Modal Box -->
  <div style="
    background: #2b2b2b;
    border: 4px solid #fff;
    padding: 24px;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    text-align: center;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    max-width: 320px;
  ">
    <h2 style="margin-top: 0; text-transform: uppercase; letter-spacing: 2px;">Retro Login</h2>
    <p style="font-size: 14px; margin-bottom: 20px;">Please authenticate to join the Airport Lounge.</p>
    
    <button id="login-btn" style="
      padding: 10px 20px;
      font-size: 16px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      background: #008080;
      color: white;
      border: 2px solid white;
      text-transform: uppercase;
    ">ENTER LOUNGE</button>
  </div>
</div>

<script>
  // Wait until the DOM is loaded
  document.addEventListener('DOMContentLoaded', () => {
    const loginBtn = document.getElementById('login-btn');
    const overlay = document.getElementById('retro-auth-overlay');


    if (loginBtn && overlay) {
      loginBtn.addEventListener('click', () => {
        // Hides the modal overlay when the button is clicked
        overlay.style.display = 'none';
        console.log('User logged in successfully!');
      });
    }
  });
</script>


</body>
</html>
