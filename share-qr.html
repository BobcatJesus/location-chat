<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Side Quest QR Share</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe7;
        --card: #fffaf2;
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5dccd;
        --accent: #d62828;
        --shadow: 0 20px 50px rgba(31, 41, 55, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(214, 40, 40, 0.12), transparent 28%),
          linear-gradient(180deg, #f8f3eb 0%, var(--bg) 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
      }
      .card {
        width: min(92vw, 560px);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 28px;
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 10px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 12px;
        color: var(--accent);
        font-weight: 700;
      }
      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 42px);
        line-height: 1.05;
      }
      p {
        margin: 14px auto 0;
        max-width: 42ch;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }
      .qr-wrap {
        margin: 26px auto 18px;
        width: min(72vw, 360px);
        aspect-ratio: 1;
        padding: 16px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        display: grid;
        place-items: center;
      }
      .qr-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
      }
      .url {
        margin-top: 10px;
        font-size: 14px;
        color: var(--muted);
        word-break: break-all;
      }
      .cta {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      .cta:hover { background: #111827; }
      .note {
        margin-top: 18px;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Side Quest</p>
      <h1>Scan to open the site</h1>
      <p>Use this QR code to go straight to the app on another phone or computer.</p>
      <div class="qr-wrap">
        <img src="sidequestbobcatjesus-qr.png" alt="QR code for sidequestbobcat.com" />
      </div>
      <div class="url">https://sidequestbobcat.com</div>
      <a class="cta" href="https://sidequestbobcat.com" target="_blank" rel="noreferrer">Open site</a>
      <div class="note">Keep this page open or print it for quick sharing.</div>
    </main>
  </body>
</html>
